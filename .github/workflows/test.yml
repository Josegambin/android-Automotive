name: Test Anbox Setup

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Esto te permite ejecutarlo manualmente desde la pestaña Actions

jobs:
  test-anbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Setup Anbox Cloud Action
        uses: ./.github/actions/setup-anbox
        with:
          channel: 'latest/stable'
          lxd-channel: '5.21/stable'
          storage-size: 30
          # Si tienes un token de Ubuntu Pro, pásalo aquí como secreto
          # ubuntu-pro-token: ${{ secrets.UBUNTU_PRO_TOKEN }}
